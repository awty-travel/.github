name: Bug report
description: Something behaves differently than it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any exact error text.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser or device, OS version, and the app version or commit.
